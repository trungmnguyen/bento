[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bento-harness"
version = "0.1.0"
description = "Clean-architecture Harness Engineering System for testing, benchmarking, and closed-loop agent verification"
readme = "README.md"
authors = [{ name = "Trung Nguyen", email = "trungmnguyen@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bento = "bento.frameworks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
